services:
  - type: web
    name: ai-turf-prediction
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      # - key: SECRET_API_KEY
      #   value: "YOUR_SECRET_HERE" # 秘密のパスワード等はRenderのダッシュボードから設定推奨
