<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI競馬予想 - {{ race.race_name }}</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-main: #0f1115;
            --card-bg: rgba(25, 28, 36, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --gold: #fbbf24;
            --gold-glow: rgba(251, 191, 36, 0.2);
            --accent: #3b82f6;
            --border: rgba(255, 255, 255, 0.1);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
        }
        
        header {
            background: rgba(15, 17, 21, 0.8);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #fff, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        main {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            text-decoration: none;
            margin-bottom: 2rem;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.1);
        }

        .race-title-area {
            margin-bottom: 2rem;
        }

        .race-title {
            font-size: 2rem;
            font-weight: 800;
            color: var(--gold);
            margin-bottom: 0.5rem;
        }

        .race-meta {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .chart-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            height: 350px;
        }

        .table-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            text-align: left;
            font-weight: 700;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .top-pick {
            background: rgba(251, 191, 36, 0.05);
        }
        
        .mark {
            font-weight: 900;
            font-size: 1.2rem;
            color: var(--gold);
        }

        .ad-space {
            margin-top: 3rem;
            background: var(--card-bg);
            border: 1px dashed var(--text-muted);
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <i class="fa-solid fa-horse-head"></i> AI Turf Prediction
        </div>
    </header>

    <main>
        <a href="/" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i> レース一覧に戻る
        </a>

        <div class="race-title-area">
            <h1 class="race-title">{{ race.race_name }}</h1>
            <div class="race-meta">
                <i class="fa-regular fa-calendar"></i> {{ race.date }} 
                <span style="margin: 0 0.5rem">|</span> 
                <i class="fa-solid fa-map-location-dot"></i> {{ race.location }}
            </div>
        </div>

        <div class="dashboard-grid">
            <div class="chart-card">
                <canvas id="mainChart"></canvas>
            </div>

            <div class="table-card">
                <table>
                    <thead>
                        <tr>
                            <th>印</th>
                            <th>馬名</th>
                            <th>スコア</th>
                            <th>AI見解</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for horse in race.horses %}
                        <tr class="{% if loop.index <= 3 %}top-pick{% endif %}">
                            <td class="mark">{{ horse.mark }}</td>
                            <td style="font-weight: 700;">{{ horse.name }}</td>
                            <td style="color: var(--gold); font-weight: 700;">{{ horse.score }}</td>
                            <td style="font-size: 0.9rem; color: var(--text-muted);">{{ horse.comment }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>

        <div class="ad-space">
            スポンサーリンク (AdSense Code Here)
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            Chart.defaults.color = '#94a3b8';
            Chart.defaults.font.family = "'Noto Sans JP', sans-serif";

            const ctx = document.getElementById('mainChart');
            new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['スピード', 'スタミナ', '血統', '騎手', '過去実績'],
                    datasets: [{
                        label: '本命馬の能力値',
                        data: [
                            {{ race.horses[0].metrics.speed }},
                            {{ race.horses[0].metrics.stamina }},
                            {{ race.horses[0].metrics.pedigree }},
                            {{ race.horses[0].metrics.jockey }},
                            {{ race.horses[0].metrics.past_record }}
                        ],
                        backgroundColor: 'rgba(251, 191, 36, 0.2)',
                        borderColor: 'rgba(251, 191, 36, 1)',
                        pointBackgroundColor: 'rgba(251, 191, 36, 1)',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        r: {
                            angleLines: { color: 'rgba(255, 255, 255, 0.1)' },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            ticks: { display: false, min: 0, max: 100 }
                        }
                    }
                }
            });
        });
    </script>
</body>
</html>
